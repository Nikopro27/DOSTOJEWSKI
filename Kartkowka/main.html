<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikodem P kartkowka 08</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-sm p-3">
                    <h2>
                        <div id="naglowek" class="mb-4 text-center">Liczba aplikacji: 0</div>
                    </h2>
                    <form id="formularz">
                        <div class="mb-3">
                            <label for="numerApp" class="form-label">Numer aplikacji:</label>
                            <input type="number" class="form-control" id="numerApp" required>
                        </div>
                        <div id="komunikatBledu" class="alert alert-danger d-none" role="alert">
                            Nieprawidłowy numer aplikacji
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Zatwierdź wybór</button>
                    </form>
                    <div id="wynik" class="alert alert-success mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="wariant08.js"></script>
</body>

</html>
